  "event": "Five months in, the shifts run on routine: Corazon gets there, does the work, gets out. What she doesn't do anymore is feel much while it's happening. On Thursday she was at the nurses' station catching up on charting — still behind — when the older man in the room at the end of the hall started calling out. He has been on the rehab ward about three weeks recovering from a hip replacement, family hasn't been in once. A coworker picked it up and went down, and Corazon could hear the tone from where she sat: not loud, not unkind exactly, just flat in the way that means this is the fourth time and I have other things. When the coworker came back she said something like he just wants company, his family never comes — a small edge under it, the kind that means he should know better by now. Corazon looked at her chart. She has been the one, for most of twenty years on this floor, who would have set her pen down and walked in. She didn't set her pen down. She finished her section, clocked out, and drove home in the dark. At eleven she put the sinigang on because the smell usually brings something back, but she stood over the pot thinking about the man in that room and thinking about her father, and then she turned the stove off and went to bed without eating any of it. The smell stayed in the kitchen. She was up at five-thirty.",
