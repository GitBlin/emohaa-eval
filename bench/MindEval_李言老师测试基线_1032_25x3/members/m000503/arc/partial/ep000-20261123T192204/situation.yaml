  "event": "Three months since Rafael's heart attack, and Cesar has the routine down: barely eat during the day, manage what people see, and after Yolanda goes up around ten, take what's left of the night alone in the kitchen. The one thing still intact is the Sunday Greenbelt laps — Rafael calls, they meet, they walk slowly and talk about nothing that needs to go anywhere.\n\nThis past Sunday they were halfway through the second lap — Cesar talking through a compressor job, Rafael on his son's spring soccer — when Rafael said, without any buildup: 'I keep waiting for you to show up at Ma's.' Not a question. Nothing about eating, nothing about Cesar's health. Just that he'd been waiting. He moved on before Cesar had anything to say back. Cesar said 'yeah, I know' and they walked to the cars.\n\nHe stayed down that night until past one. Counter, fridge, TV low, three beers. He kept coming back to the way Rafael said it — not worried, not watching him, just waiting on him to come back. He didn't know what to do with that.",
