  "event": "Six months into the layoff, late February, Luis's mother called on Sunday after mass, the way she does every week. Early in the call she mentioned that a cousin is getting married in the fall, and that she'd already told the family Luis would handle the invitations — the lettering, something beautiful, the kind of thing he does. She said it the way she always does, like it was simply true. He told her of course, he'd reach out to the cousin that week. They said goodbye.\n\nAfterward he sat in the front room with his coffee until it went cold. He picked up his phone, opened a new note, and typed the cousin's name. He didn't send the message. By midweek his mother's family thread had two new notifications; he unlocked the phone both times, saw them, and left them unread. The cousin's name is still sitting in the note. He hasn't told his mother how it is, and he hasn't told Marisol that the commission is already sitting there undone.",
