  "event": "The six weeks since she said yes in the parking lot have been running one into the next — rebuilt schedules, receiving runs, the reset, her own floor shifts, and the constant work of making it look like none of it is costing anything. This week the district office asked for receiving figures covering the past four weeks. She'd been keeping her own log in a notebook, but when she sat down Wednesday evening before closing she found a three-day stretch where she'd been pulled onto the floor mid-receiving and the log went patchy. She filled the gap from what she could reconstruct from memory and what she could pull from the system, and sent the numbers before anyone had to ask twice. She hasn't heard anything back.\n\nSince she sent that email she's checked her phone for a reply before bed, again around 2am when she woke, and again before her Thursday shift. Her back was worse across the week — the longer hours, the stockroom during receiving — and by Thursday she was shortening her stride between aisles to keep it off her face. Nobody said anything. She drove home Thursday and sat in the driveway until the windows fogged, then went inside. Marcus had tea on the counter. She said she was tired and went to bed early.\n\nThe four art supply bags are still by the front door.",
