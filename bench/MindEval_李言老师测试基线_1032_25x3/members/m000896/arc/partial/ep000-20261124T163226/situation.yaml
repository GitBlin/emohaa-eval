  "event": "Late in the week, on a Wednesday afternoon, Bharat was at the kitchen table in Priya's house — he moved his chair some weeks ago so it faces the hallway — when the doorbell rang. Before he had finished thinking he was on his feet and in the unlit hallway, watching through the sidelight until a teenage girl from the neighbour's place left a note under the mat and walked away with her misdelivered parcel. Four minutes. He had the screwdriver from the kitchen junk drawer in his hand; he had no clear memory of picking it up. He slid it into his cardigan pocket and did not move until the street was empty. When Priya came home an hour later and found the note, she rang the neighbour and sorted it out in two minutes while he stood at the stove with the kettle. He said nothing about the hallway or the screwdriver. He got through dinner. At 4 a.m. he was at the deadbolt — third check — and when he lay back down he could not stop turning it: what if they had followed him from the old street, what if someone had been watching to see who came to the door, what if the next ring was not a teenager.",
