  "event": "Ten weeks in, she had the rotation working — or working enough. Her cousin's spare room in Converse through the end of the week, motel after that, and a studio listing she'd been watching that sat just at the ceiling of what she could carry if she stretched.\n\nThursday evening her cousin came home and said it easily, apologetically: her partner was flying back earlier than expected, she'd need the spare room by tomorrow morning. No argument — just the way things go. Kristine said of course, not a problem, and had her bags in the Corolla before her cousin finished the sentence.\n\nShe didn't book the motel that night. It was two days early and she'd been trying to hold the rate off as long as she could. She drove to a parking lot off Loop 1604 and reclined the seat and lay there in the summer heat with the windows cracked, running the AC in short bursts so she wouldn't drain the battery. Before she tried to sleep she reorganized the back seat — moved the box with her certification materials to one side, straightened the bag with the yarn in it — the way she does every time the car becomes the room. She was up when the lot got loud.\n\nIn the morning she booked the motel. The weekly rate was up from last time. She paid it without looking at the total twice, then checked her phone on her first break and saw the studio listing had closed — someone else's application had gone through.",
